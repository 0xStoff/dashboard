server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(?:og\.png|favicon\.(?:ico|png)|logo192\.png|logo512\.png|manifest\.json|robots\.txt)$ {
        root /app-public;
        try_files $uri =404;
        expires 1d;
        add_header Cache-Control "public";
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|webp|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
